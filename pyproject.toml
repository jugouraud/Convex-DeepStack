[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convex-deepstack"
version = "0.1.0"
description = "Convex residual stacking with SCNN and WaDiRo-SCNN blocks"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clarabel",
    "numpy",
    "optuna",
    "torch",
    "wadiroscnn>=0.6,<0.7",
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
experiments = [
    "matplotlib",
    "pandas",
    "POT",
    "scikit-learn",
    "scipy",
    "tqdm",
]
dev = [
    "matplotlib",
    "pandas",
    "POT",
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["convex_deepstack*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["convex_deepstack", "experiments"]
